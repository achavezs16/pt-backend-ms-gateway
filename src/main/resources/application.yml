server:
  port: 8086

spring:
  application:
    name: ms-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3001"
              - "http://localhost:3002"
              - "http://127.0.0.1:3002"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

      routes:
        # Rutas para el ms-user
        - id: ms-user
          uri: http://ms-user:8085
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/dashboard/**,/api/v1/users/**,/api/v1/pymes/**

        # Rutas para ms-productos
        - id: ms-productos
          uri: http://ms-productos:8081
          predicates:
            - Path=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/inventario/**

        # Rutas para ms-pedidos
        - id: ms-pedidos
          uri: http://ms-pedidos:8082
          predicates:
            - Path=/api/v1/pedidos/**

        # Rutas para el BFF
        - id: ms-bff
          uri: http://ms-bff:8084
          predicates:
            - Path=/api/v1/bff/**

logging:
  level:
    cl.pymetrack.msgateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always