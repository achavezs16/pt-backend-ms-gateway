server:
  port: 8086

spring:
  application:
    name: ms-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

      routes:
        - id: ms-user
          uri: http://172.31.84.36:8085
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/dashboard/**,/api/v1/users/**,/api/v1/pymes/**

        - id: ms-productos
          uri: http://172.31.74.61:8081
          predicates:
            - Path=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/inventario/**

        - id: ms-pedidos
          uri: http://172.31.89.3:8082
          predicates:
            - Path=/api/v1/pedidos/**

        - id: ms-bff
          uri: http://172.31.16.165:8084
          predicates:
            - Path=/api/v1/bff/**

logging:
  level:
    cl.pymetrack.msgateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always